<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UTT AI SAFETY - LIVE MONITORING</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8f9fa">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>

<body>
    <div class="app-wrapper">
        <!-- ── Header ── -->
        <header class="app-header">
            <div class="header-left">
                <h1>UTT AI SAFETY</h1>
                <span id="yolo-status" class="yolo-status"><span class="status-dot"></span> <span id="yolo-status-text">MODEL LOADING...</span></span>
            </div>
            <div class="header-actions">
                <div class="notif-badge-container">
                    <button class="btn-circle" id="btn-notifications"><i data-lucide="bell"></i></button>
                    <span id="notif-count" class="badge-count">0</span>
                </div>
                <button class="btn-circle primary" id="btn-add-device"><i data-lucide="plus"></i></button>
            </div>
        </header>

        <!-- ── Main Content (SPA Sections) ── -->
        <main class="app-main">
            
            <!-- SECTION 1: HOME (GRID MONITORING) -->
            <section id="section-home" class="page-section active">
                <!-- Camera Grid Controls -->
                <div class="grid-controls glass">
                    <label for="cam-count-select">Bố cục lưới:</label>
                    <select id="cam-count-select" class="mini-select">
                        <option value="1">1 Camera</option>
                        <option value="2">2 Camera</option>
                        <option value="4" selected>4 Camera</option>
                        <option value="6">6 Camera</option>
                        <option value="8">8 Camera</option>
                    </select>
                </div>

                <!-- Main Camera Grid -->
                <div class="camera-grid grid-4" id="camera-grid-main">
                    <!-- Camera 01 (Active) -->
                    <div class="camera-card active" id="primary-cam-card">
                        <div class="cam-info-top">
                            <span class="cam-tag">CAM 01</span>
                            <button class="btn-expand"><i data-lucide="maximize"></i></button>
                        </div>
                        <div class="stream-container">
                            <img id="main-video" class="stream-view" src="" alt="Live">
                            <video id="webcam" playsinline autoplay muted style="display:none;"></video>
                            <div class="ai-overlay" id="ai-overlay"></div>
                        </div>
                    </div>
                    <!-- Placeholder Cameras will be injected by JS -->
                </div>

                <!-- AI Filtering Control -->
                <div class="ai-filter-bar glass">
                    <label class="chip">
                        <input type="checkbox" id="filter-helmet" checked>
                        <span><i data-lucide="hard-hat"></i> Mũ</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" id="filter-vest" checked>
                        <span><i data-lucide="shirt"></i> Áo</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" id="filter-sign" checked>
                        <span><i data-lucide="octagon"></i> Biển báo</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" id="filter-pose" checked>
                        <span><i data-lucide="accessibility"></i> Ngã</span>
                    </label>
                </div>
            </section>

            <!-- SECTION 2: SYSTEM (CAMERA LIST) -->
            <section id="section-system" class="page-section">
                <div class="glass section-header">
                    <h3>Hệ thống Camera</h3>
                </div>
                <div class="cam-list-vertical" id="system-cam-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <!-- SECTION 3: STATISTICS -->
            <section id="section-stats" class="page-section">
                <div class="glass section-header">
                    <h3>Thống kê Vi phạm</h3>
                </div>
                <div class="table-wrapper glass">
                    <table>
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Vị trí</th>
                                <th>Loại lỗi</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- SECTION 4: SETTINGS -->
            <section id="section-settings" class="page-section">
                <div class="glass section-header">
                    <h3>Cài đặt</h3>
                </div>
                <div class="settings-list">
                    <div class="setting-item glass">
                        <div class="setting-info">
                            <i data-lucide="moon"></i>
                            <span>Chế độ tối (Dark Mode)</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="dark-mode-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item glass">
                        <div class="setting-info">
                            <i data-lucide="shield-check"></i>
                            <span>Độ nhạy AI (Confidence)</span>
                        </div>
                        <input type="range" min="0.1" max="0.9" step="0.1" value="0.5">
                    </div>
                </div>
            </section>
        </main>

        <!-- ── Bottom Navigation ── -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-target="home">
                <i data-lucide="home"></i>
                <span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item" data-target="system">
                <i data-lucide="layout-grid"></i>
                <span>Hệ thống</span>
            </a>
            <div class="nav-item robot-central">
                <div class="robot-circle" id="ai-status-indicator">
                    <i data-lucide="bot"></i>
                </div>
            </div>
            <a href="#" class="nav-item" data-target="stats">
                <i data-lucide="bar-chart-3"></i>
                <span>Thống kê</span>
            </a>
            <a href="#" class="nav-item" data-target="settings">
                <i data-lucide="settings"></i>
                <span>Cài đặt</span>
            </a>
        </nav>

        <!-- Audio Alerts -->
        <audio id="audio-alarm" src="assets/alarm.mp3"></audio>
        <audio id="audio-warning" src="assets/warning.mp3"></audio>
    </div>

    <script src="src/script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
