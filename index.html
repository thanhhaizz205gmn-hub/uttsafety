<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UTT AI Safety - Smart Home</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8f9fa">
    
    <!-- iOS Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>

<body>
    <div class="app-wrapper">
        <!-- ── Header ── -->
        <header class="app-header">
            <div class="header-left">
                <h1>Nhà của tôi</h1>
                <span class="location-status"><i data-lucide="map-pin"></i> Đại học Công nghệ GTVT</span>
            </div>
            <div class="header-actions">
                <button class="btn-circle" id="btn-notifications"><i data-lucide="bell"></i></button>
                <button class="btn-circle primary" id="btn-add-device"><i data-lucide="plus"></i></button>
            </div>
        </header>

        <!-- ── Main Content ── -->
        <main class="app-main">
            <!-- ── AI Filtering Panel ── -->
            <section class="ai-filter-panel glass">
                <div class="panel-header">
                    <h3>Giám sát AI thông minh</h3>
                </div>
                <div class="filter-options">
                    <label class="toggle-card">
                        <input type="checkbox" id="filter-helmet" checked>
                        <div class="toggle-content">
                            <i data-lucide="hard-hat"></i>
                            <span>Mũ bảo hiểm</span>
                        </div>
                    </label>
                    <label class="toggle-card">
                        <input type="checkbox" id="filter-vest" checked>
                        <div class="toggle-content">
                            <i data-lucide="shirt"></i>
                            <span>Áo phản quang</span>
                        </div>
                    </label>
                    <label class="toggle-card">
                        <input type="checkbox" id="filter-pose" checked>
                        <div class="toggle-content">
                            <i data-lucide="accessibility"></i>
                            <span>Tư thế (Ngã)</span>
                        </div>
                    </label>
                </div>
            </section>

            <!-- ── Camera List ── -->
            <section class="camera-list" id="camera-list-container">
                <!-- Thẻ Camera 1 -->
                <div class="camera-card active" data-cam-id="cam-01">
                    <div class="card-info">
                        <div class="cam-name">
                            <span class="status-dot"></span>
                            <h4>Camera Tiền sảnh A1</h4>
                        </div>
                        <button class="btn-more"><i data-lucide="more-horizontal"></i></button>
                    </div>
                    <div class="stream-container">
                        <img id="main-video" class="stream-view" src="" alt="Live Stream">
                        <video id="webcam" playsinline autoplay muted style="display:none;"></video>
                        <div class="stream-label">LIVE</div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-action active" id="btn-start-cam"><i data-lucide="play"></i> Kết nối</button>
                        <button class="btn-action danger" id="btn-stop-cam" disabled><i data-lucide="square"></i> Dừng</button>
                        <select id="cam-source-select" class="mini-select">
                            <option value="1">Backend Server</option>
                            <option value="2">Local Cam</option>
                        </select>
                    </div>
                </div>

                <!-- Thẻ Camera 2 (Mẫu) -->
                <div class="camera-card" data-cam-id="cam-02">
                    <div class="card-info">
                        <div class="cam-name">
                            <span class="status-dot offline"></span>
                            <h4>Kho hàng B2</h4>
                        </div>
                        <button class="btn-more"><i data-lucide="more-horizontal"></i></button>
                    </div>
                    <div class="stream-container placeholder">
                        <i data-lucide="video-off"></i>
                        <p>Camera ngoại tuyến</p>
                    </div>
                </div>
            </section>

            <!-- ── Statistics ── -->
            <section class="stats-section glass">
                <h3>Lịch sử vi phạm</h3>
                <div class="table-wrapper">
                    <table id="violation-table">
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Vị trí</th>
                                <th>Loại</th>
                                <th>ID</th>
                            </tr>
                        </thead>
                        <tbody id="violation-history-body">
                            <!-- Data injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- ── Bottom Navigation ── -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i data-lucide="home"></i>
                <span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="shopping-bag"></i>
                <span>Cửa hàng</span>
            </a>
            <div class="nav-item robot-central">
                <div class="robot-circle">
                    <i data-lucide="bot"></i>
                </div>
            </div>
            <a href="#" class="nav-item">
                <i data-lucide="message-circle"></i>
                <span>Tin nhắn</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="user"></i>
                <span>Cá nhân</span>
            </a>
        </nav>

        <!-- ── Audio Alerts ── -->
        <audio id="audio-alarm" src="assets/alarm.mp3"></audio>
        <audio id="audio-warning" src="assets/warning.mp3"></audio>
    </div>

    <!-- Logic -->
    <script src="src/script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
