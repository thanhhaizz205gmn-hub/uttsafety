<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UTT AI SAFETY - LIVE MONITORING</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8f9fa">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>

<body>
    <div class="app-wrapper">
        <!-- ── Header ── -->
        <header class="app-header glass">
            <div class="header-left">
                <img src="assets/logo.png" alt="UTT Logo" class="app-logo" onerror="this.style.display='none'">
                <div class="brand-text">
                    <h1>UTT AI SAFETY</h1>
                    <div id="yolo-status" class="yolo-status">
                        <span class="status-dot"></span>
                        <span id="yolo-status-text">MODEL LOADING...</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <div class="notif-badge-container">
                    <button class="btn-circle" id="btn-notifications"><i data-lucide="bell"></i></button>
                    <span id="notif-count" class="badge-count">0</span>
                </div>
            </div>
        </header>

        <!-- ── Main Content (SPA Sections) ── -->
        <main class="app-main">

            <!-- SECTION 1: HOME (GRID MONITORING) -->
            <section id="section-home" class="page-section active">
                <!-- Camera Grid Controls -->
                <div class="grid-controls glass">
                    <span id="active-cam-label">CAM 01</span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <!-- NÚT + CHỌN VIDEO INLINE (Giống bản giaodienvtv) -->
                        <button class="btn-upload-inline" id="btn-upload-video" title="Tải video lên">
                            <i data-lucide="plus-circle"></i>
                            <span>Video</span>
                        </button>
                        <input type="file" id="file-upload" style="display:none" accept="video/*">

                        <select id="cam-count-select" class="mini-select">
                            <option value="1" selected>1 Camera</option>
                            <option value="2">2 Camera</option>
                            <option value="4">4 Camera</option>
                            <option value="6">6 Camera</option>
                        </select>
                    </div>
                </div>

                <!-- Main Camera Grid (Mặc định grid-1) -->
                <div class="camera-grid grid-1" id="camera-grid-main">
                    <!-- Camera 01 (Active) -->
                    <div class="camera-card active" id="primary-cam-card">
                        <div class="cam-info-top">
                            <span class="cam-tag">CAM 01</span>
                            <span class="ai-indicator active"></span>
                        </div>
                        <div class="stream-container">
                            <!-- Overlay canvas để vẽ bounding box -->
                            <canvas id="overlay-canvas" class="ai-overlay"></canvas>
                            <img id="main-video" class="stream-view" src="" alt="Live" style="display:none;">
                            <video id="webcam" playsinline autoplay muted
                                style="width:100%; height:100%; object-fit:cover;"></video>
                        </div>
                    </div>
                </div>

                <!-- AI Filtering Control -->
                <div class="ai-filter-bar glass">
                    <label class="chip">
                        <input type="checkbox" id="filter-helmet" checked>
                        <span><i data-lucide="shield"></i> Mũ</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" id="filter-vest" checked>
                        <span><i data-lucide="shirt"></i> Áo</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" id="filter-sign" checked>
                        <span><i data-lucide="octagon"></i> Biển báo</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" id="filter-pose" checked>
                        <span><i data-lucide="accessibility"></i> Ngã</span>
                    </label>
                </div>
            </section>

            <!-- SECTION 2: SYSTEM (CAMERA LIST) -->
            <section id="section-system" class="page-section">
                <div class="section-header">Hệ thống Camera</div>
                <div class="cam-list-vertical" id="system-cam-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <!-- SECTION 3: STATISTICS -->
            <section id="section-stats" class="page-section">
                <div class="section-header">Thống kê Vi phạm</div>
                <div class="table-wrapper glass">
                    <table>
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Vị trí</th>
                                <th>Loại lỗi</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- SECTION 4: SETTINGS -->
            <section id="section-settings" class="page-section">
                <div class="section-header">Cài đặt</div>
                <div class="settings-list">
                    <div class="setting-item glass">
                        <div class="setting-info">
                            <i data-lucide="moon"></i>
                            <span>Chế độ tối (Dark Mode)</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="dark-mode-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </section>
        </main>

        <!-- ── Bottom Navigation ── -->
        <nav class="bottom-nav glass">
            <a href="#" class="nav-item active" data-target="home">
                <i data-lucide="home"></i><span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item" data-target="system">
                <i data-lucide="video"></i><span>Hệ thống</span>
            </a>
            <div class="robot-central">
                <div class="robot-circle" id="ai-status-indicator">
                    <i data-lucide="bot"></i>
                </div>
            </div>
            <a href="#" class="nav-item" data-target="stats">
                <i data-lucide="bar-chart-3"></i><span>Thống kê</span>
            </a>
            <a href="#" class="nav-item" data-target="settings">
                <i data-lucide="settings"></i><span>Cài đặt</span>
            </a>
        </nav>

        <!-- Audio Alerts -->
        <audio id="audio-alarm" src="assets/alarm.mp3" preload="auto"></audio>
        <audio id="audio-warning" src="assets/warning.mp3" preload="auto"></audio>
    </div>

    <script src="src/script.js"></script>
</body>

</html>
